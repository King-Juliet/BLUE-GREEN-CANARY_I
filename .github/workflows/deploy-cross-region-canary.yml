# CD: one live region at a time.
#
#   first release  -> blue only, 100% of traffic
#   later releases -> bring up the idle region, canary 10% -> bake -> 100%, then destroy the old region
#
# The database lives in its own always-on stack (infrastructure/data) and is shared by both regions.
# Runs only after the Continuous Integration workflow completes successfully on main
# (or via manual workflow_dispatch), so nothing deploys on a failed CI run.
name: Cross-Region Blue-Green Canary Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  INITIALIZATION_PARAMETER: /bluegreen-canary/deployment/initialized
  ACTIVE_REGION_PARAMETER: /bluegreen-canary/deployment/active-region
  ROUTE53_ZONE_NAME: ${{ vars.ROUTE53_ZONE_NAME }}
  ROUTE53_RECORD_NAME: ${{ vars.ROUTE53_RECORD_NAME }}
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  BLUE_REPOSITORY_URI: ${{ vars.BLUE_REPOSITORY_URI }}
  GREEN_REPOSITORY_URI: ${{ vars.GREEN_REPOSITORY_URI }}
  BLUE_FRONTEND_CLUSTER: bluegreen-canary-blue-blue-frontend-cluster
  BLUE_FRONTEND_SERVICE: bluegreen-canary-blue-blue-frontend-service
  BLUE_BACKEND_CLUSTER: bluegreen-canary-blue-blue-backend-cluster
  BLUE_BACKEND_SERVICE: bluegreen-canary-blue-blue-backend-service
  GREEN_FRONTEND_CLUSTER: bluegreen-canary-green-green-frontend-cluster
  GREEN_FRONTEND_SERVICE: bluegreen-canary-green-green-frontend-service
  GREEN_BACKEND_CLUSTER: bluegreen-canary-green-green-backend-cluster
  GREEN_BACKEND_SERVICE: bluegreen-canary-green-green-backend-service
  BLUE_MIGRATE_TASK_FAMILY: bluegreen-canary-blue-blue-migrate-task
  GREEN_MIGRATE_TASK_FAMILY: bluegreen-canary-green-green-migrate-task
  BLUE_ALB_NAME: ${{ vars.BLUE_ALB_NAME }}
  GREEN_ALB_NAME: ${{ vars.GREEN_ALB_NAME }}
  BLUE_ALARM_NAME: ${{ vars.BLUE_ALARM_NAME }}
  GREEN_ALARM_NAME: ${{ vars.GREEN_ALARM_NAME }}
  # How many 30-second checks the canary is watched for. Optional repo variable CANARY_BAKE_CHECKS
  # (for example 40 = 20 minutes) gives you time to test by hand.
  BAKE_CHECKS: ${{ vars.CANARY_BAKE_CHECKS || '10' }}

jobs:
  # Decide what this release is, then create/update ONLY what it needs:
  # the Route 53 zone, the shared database stack, and the target region.
  provision-infrastructure:
    name: Provision infrastructure
    runs-on: ubuntu-latest
    environment: production
    # Manual workflow_dispatch always runs; a workflow_run trigger only proceeds if CI succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      deployment_target: ${{ steps.release-mode.outputs.deployment_target }}
      active_region: ${{ steps.release-mode.outputs.active_region }}
      release_mode: ${{ steps.release-mode.outputs.release_mode }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # First release: only blue is built. Later releases build the region that is NOT active.
      - name: Determine release mode
        id: release-mode
        run: |
          set -euo pipefail
          if ! aws ssm get-parameter --region us-east-1 --name "${INITIALIZATION_PARAMETER}" >/dev/null 2>&1; then
            TARGET="blue"
            ACTIVE_REGION="blue"
            RELEASE_MODE="initial"
          else
            ACTIVE_REGION=$(aws ssm get-parameter --region us-east-1 --name "${ACTIVE_REGION_PARAMETER}" --query 'Parameter.Value' --output text)
            if [ "${ACTIVE_REGION}" = "blue" ]; then TARGET="green"; else TARGET="blue"; fi
            RELEASE_MODE="canary"
          fi
          echo "deployment_target=${TARGET}" >> "${GITHUB_OUTPUT}"
          echo "active_region=${ACTIVE_REGION}" >> "${GITHUB_OUTPUT}"
          echo "release_mode=${RELEASE_MODE}" >> "${GITHUB_OUTPUT}"
          echo "Release mode: ${RELEASE_MODE}"
          echo "Target region (to build): ${TARGET}"
          echo "Active region: ${ACTIVE_REGION}"

      - name: Plan global Route 53 zone
        run: |
          terraform -chdir=infrastructure/global init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=global/terraform.tfstate" \
            -backend-config="region=us-east-1"
          terraform -chdir=infrastructure/global plan -input=false -out=tfplan

      - name: Upload global plan
        uses: actions/upload-artifact@v4
        with:
          name: global-tfplan
          path: infrastructure/global/tfplan
          retention-days: 5

      - name: Apply global Route 53 zone
        run: terraform -chdir=infrastructure/global apply -input=false tfplan

      - name: Plan shared database stack
        run: |
          terraform -chdir=infrastructure/data init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=data/terraform.tfstate" \
            -backend-config="region=us-east-1"
          terraform -chdir=infrastructure/data plan -input=false -out=tfplan

      - name: Upload shared database plan
        uses: actions/upload-artifact@v4
        with:
          name: data-tfplan
          path: infrastructure/data/tfplan
          retention-days: 5

      - name: Apply shared database stack
        run: terraform -chdir=infrastructure/data apply -input=false tfplan

      - name: Plan blue regional infrastructure
        if: steps.release-mode.outputs.deployment_target == 'blue'
        run: |
          terraform -chdir=infrastructure/us-east-1 init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=blue/terraform.tfstate" \
            -backend-config="region=us-east-1"
          terraform -chdir=infrastructure/us-east-1 plan -input=false -out=tfplan

      - name: Upload blue regional plan
        if: steps.release-mode.outputs.deployment_target == 'blue'
        uses: actions/upload-artifact@v4
        with:
          name: blue-regional-tfplan
          path: infrastructure/us-east-1/tfplan
          retention-days: 5

      - name: Apply blue regional infrastructure
        if: steps.release-mode.outputs.deployment_target == 'blue'
        run: terraform -chdir=infrastructure/us-east-1 apply -input=false tfplan

      - name: Plan green regional infrastructure
        if: steps.release-mode.outputs.deployment_target == 'green'
        run: |
          terraform -chdir=infrastructure/eu-north-1 init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=green/terraform.tfstate" \
            -backend-config="region=us-east-1"
          terraform -chdir=infrastructure/eu-north-1 plan -input=false -out=tfplan

      - name: Upload green regional plan
        if: steps.release-mode.outputs.deployment_target == 'green'
        uses: actions/upload-artifact@v4
        with:
          name: green-regional-tfplan
          path: infrastructure/eu-north-1/tfplan
          retention-days: 5

      - name: Apply green regional infrastructure
        if: steps.release-mode.outputs.deployment_target == 'green'
        run: terraform -chdir=infrastructure/eu-north-1 apply -input=false tfplan

  # Build, migrate, deploy the target region, then run the canary.
  build-and-deploy:
    needs: provision-infrastructure
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_TARGET: ${{ needs.provision-infrastructure.outputs.deployment_target }}
      ACTIVE_REGION: ${{ needs.provision-infrastructure.outputs.active_region }}
      RELEASE_MODE: ${{ needs.provision-infrastructure.outputs.release_mode }}
    outputs:
      promoted: ${{ steps.retire.outputs.promoted }}
      old_region: ${{ steps.retire.outputs.old_region }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---- blue target -------------------------------------------------------------------
      - name: Build and push image to blue region registry
        if: env.DEPLOYMENT_TARGET == 'blue'
        run: |
          docker build -f applications/frontend/Dockerfile -t ${BLUE_REPOSITORY_URI}:frontend-${IMAGE_TAG} applications/frontend
          docker push ${BLUE_REPOSITORY_URI}:frontend-${IMAGE_TAG}
          docker build -f applications/backend/Dockerfile -t ${BLUE_REPOSITORY_URI}:backend-${IMAGE_TAG} applications/backend
          docker push ${BLUE_REPOSITORY_URI}:backend-${IMAGE_TAG}

      # One migration per release, against the shared database, run from the target region.
      - name: Run database migrations (blue)
        if: env.DEPLOYMENT_TARGET == 'blue'
        run: bash scripts/run-migration.sh us-east-1 "${BLUE_BACKEND_CLUSTER}" "${BLUE_BACKEND_SERVICE}" "${BLUE_MIGRATE_TASK_FAMILY}" "${BLUE_REPOSITORY_URI}:backend-${IMAGE_TAG}"

      - name: Deploy blue region
        if: env.DEPLOYMENT_TARGET == 'blue'
        run: |
          set -euo pipefail
          bash scripts/deploy-service.sh us-east-1 "${BLUE_FRONTEND_CLUSTER}" "${BLUE_FRONTEND_SERVICE}" "${BLUE_REPOSITORY_URI}:frontend-${IMAGE_TAG}" blue-frontend-task-definition
          bash scripts/deploy-service.sh us-east-1 "${BLUE_BACKEND_CLUSTER}" "${BLUE_BACKEND_SERVICE}" "${BLUE_REPOSITORY_URI}:backend-${IMAGE_TAG}" blue-backend-task-definition

      # ---- green target ------------------------------------------------------------------
      - name: Login to green region ECR
        if: env.DEPLOYMENT_TARGET == 'green'
        run: |
          aws ecr get-login-password --region eu-north-1 | \
            docker login --username AWS --password-stdin "$(echo "${GREEN_REPOSITORY_URI}" | cut -d/ -f1)"

      - name: Build and push image to green region registry
        if: env.DEPLOYMENT_TARGET == 'green'
        run: |
          docker build -f applications/frontend/Dockerfile -t ${GREEN_REPOSITORY_URI}:frontend-${IMAGE_TAG} applications/frontend
          docker push ${GREEN_REPOSITORY_URI}:frontend-${IMAGE_TAG}
          docker build -f applications/backend/Dockerfile -t ${GREEN_REPOSITORY_URI}:backend-${IMAGE_TAG} applications/backend
          docker push ${GREEN_REPOSITORY_URI}:backend-${IMAGE_TAG}

      - name: Run database migrations (green)
        if: env.DEPLOYMENT_TARGET == 'green'
        run: bash scripts/run-migration.sh eu-north-1 "${GREEN_BACKEND_CLUSTER}" "${GREEN_BACKEND_SERVICE}" "${GREEN_MIGRATE_TASK_FAMILY}" "${GREEN_REPOSITORY_URI}:backend-${IMAGE_TAG}"

      - name: Deploy green region
        if: env.DEPLOYMENT_TARGET == 'green'
        run: |
          set -euo pipefail
          bash scripts/deploy-service.sh eu-north-1 "${GREEN_FRONTEND_CLUSTER}" "${GREEN_FRONTEND_SERVICE}" "${GREEN_REPOSITORY_URI}:frontend-${IMAGE_TAG}" green-frontend-task-definition
          bash scripts/deploy-service.sh eu-north-1 "${GREEN_BACKEND_CLUSTER}" "${GREEN_BACKEND_SERVICE}" "${GREEN_REPOSITORY_URI}:backend-${IMAGE_TAG}" green-backend-task-definition

      # ---- checks ------------------------------------------------------------------------
      # /api/health runs SELECT 1 against the shared database, so this also proves the peering works.
      - name: Smoke test deployed region
        run: |
          set -euo pipefail
          if [ "${DEPLOYMENT_TARGET}" = "blue" ]; then
            REGION=us-east-1; ALB_NAME="${BLUE_ALB_NAME}"
          else
            REGION=eu-north-1; ALB_NAME="${GREEN_ALB_NAME}"
          fi
          DNS_NAME=$(aws elbv2 describe-load-balancers --region "${REGION}" --names "${ALB_NAME}" --query 'LoadBalancers[0].DNSName' --output text)
          curl --fail --silent --show-error "http://${DNS_NAME}/"
          curl --fail --silent --show-error "http://${DNS_NAME}/api/health"

      # ---- first release: blue takes everything -------------------------------------------
      - name: Route all traffic to blue and record it as active (first release)
        if: env.RELEASE_MODE == 'initial'
        run: |
          set -euo pipefail
          bash scripts/route53.sh init blue
          aws ssm put-parameter --region us-east-1 --name "${INITIALIZATION_PARAMETER}" --type String --value "${IMAGE_TAG}" --overwrite
          aws ssm put-parameter --region us-east-1 --name "${ACTIVE_REGION_PARAMETER}" --type String --value "blue" --overwrite

      # ---- later releases: canary ---------------------------------------------------------
      - name: Shift 10% of traffic to the new region
        if: env.RELEASE_MODE == 'canary'
        run: bash scripts/route53.sh split "${ACTIVE_REGION}" "${DEPLOYMENT_TARGET}" 90 10

      # While the canary runs, a visitor stays in the region they were first sent to.
      - name: Turn on canary session pinning
        if: env.RELEASE_MODE == 'canary'
        run: |
          set -euo pipefail
          # Set first, so the cleanup step below runs even if only one of the two load balancers got its rules.
          echo "PINS_ENABLED=true" >> "${GITHUB_ENV}"
          bash scripts/canary-pin.sh enable "${ACTIVE_REGION}" "${DEPLOYMENT_TARGET}"
          bash scripts/canary-pin.sh enable "${DEPLOYMENT_TARGET}" "${ACTIVE_REGION}"

      - name: Monitor and automatically roll back on alarm
        if: env.RELEASE_MODE == 'canary'
        run: |
          set -euo pipefail

          ROLLED_BACK=0
          rollback() {
            if [ "${ROLLED_BACK}" -eq 1 ]; then
              return
            fi
            ROLLED_BACK=1
            echo "Rolling all traffic back to ${ACTIVE_REGION}. The new region (${DEPLOYMENT_TARGET}) is left running so you can investigate."
            bash scripts/route53.sh split "${ACTIVE_REGION}" "${DEPLOYMENT_TARGET}" 100 0
          }
          trap 'status=$?; if [ "${status}" -ne 0 ]; then rollback; fi; exit "${status}"' EXIT

          for attempt in $(seq 1 "${BAKE_CHECKS}"); do
            BLUE_STATE=$(aws cloudwatch describe-alarms --region us-east-1 \
              --alarm-names "${BLUE_ALARM_NAME}" \
              --query 'MetricAlarms[0].StateValue' --output text)
            GREEN_STATE=$(aws cloudwatch describe-alarms --region eu-north-1 \
              --alarm-names "${GREEN_ALARM_NAME}" \
              --query 'MetricAlarms[0].StateValue' --output text)
            echo "Bake check ${attempt}/${BAKE_CHECKS}: blue=${BLUE_STATE}, green=${GREEN_STATE}"

            if [ "${BLUE_STATE}" = "ALARM" ] || [ "${GREEN_STATE}" = "ALARM" ]; then
              rollback
              exit 1
            fi

            if [ "${attempt}" -lt "${BAKE_CHECKS}" ]; then
              sleep 30
            fi
          done

      - name: Promote new region to 100% traffic
        if: env.RELEASE_MODE == 'canary'
        run: |
          set -euo pipefail
          bash scripts/route53.sh split "${DEPLOYMENT_TARGET}" "${ACTIVE_REGION}" 100 0
          aws ssm put-parameter --region us-east-1 --name "${ACTIVE_REGION_PARAMETER}" --type String --value "${DEPLOYMENT_TARGET}" --overwrite

      # Runs after a promote AND after a rollback, so the redirect rules never outlive the canary.
      - name: Turn off canary session pinning
        if: always() && env.PINS_ENABLED == 'true'
        run: |
          set -euo pipefail
          bash scripts/canary-pin.sh disable "${ACTIVE_REGION}" "${DEPLOYMENT_TARGET}"
          bash scripts/canary-pin.sh disable "${DEPLOYMENT_TARGET}" "${ACTIVE_REGION}"

      # Only reached when the canary finished and was promoted.
      - name: Remove the old region's Route 53 records
        id: retire
        if: env.RELEASE_MODE == 'canary'
        run: |
          set -euo pipefail
          bash scripts/route53.sh retire "${ACTIVE_REGION}" "${DEPLOYMENT_TARGET}"
          echo "promoted=true" >> "${GITHUB_OUTPUT}"
          echo "old_region=${ACTIVE_REGION}" >> "${GITHUB_OUTPUT}"

  # Last step of a successful canary: the old region is no longer needed, so it is destroyed.
  # It only runs when build-and-deploy reported that the new region was promoted to 100%.
  destroy-old-region:
    name: Destroy old region
    needs: build-and-deploy
    if: needs.build-and-deploy.outputs.promoted == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Destroy the old region
        run: bash scripts/destroy-region.sh "${{ needs.build-and-deploy.outputs.old_region }}"